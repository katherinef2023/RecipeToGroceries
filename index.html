<html>
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recipes to Groceries</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="RecipesToGroceriesLogo.png" type="image/x-icon">
</head>



<body>
    <!--Quick reminder to self: to update with terminal: git pull, git add ., git commit -m "blahbalh", git push-->
    <div class="navBar">
        <a href="index.html"><img src="RecipesToGroceriesLogo.png" width="60px"></a>
        <h3>Recipes to Groceries</h3>
    </div>
    <div>
        <p>
            Put the recipe title in the first box, ingredients in the 2nd formatted like "1 tomato, 5 beans, 3 oranges", and instructions in the 3rd box, then add the recipe!
        </p>
        <input style="width: 200px" id="recipeName"><br>
        <textarea style="width: 200px" id="ingredients"></textarea><br>
        <textarea style="width: 200px" id="instructions"></textarea><br>
        <button id="addBtn">Add Recipe</button>
        <p id="output"></p>
    </div>
    
    <div>
        <h3>Grocery List:</h3>
        <ul id="groceryListContainer"></ul>
    </div>

    <div>
        
        <div class="flex" style="margin:0px">
            <h2>Recipe Search:</h2>
            <input style="height:30px" id="recipeSearch">
            <button id="searchBtn">Apply</button>
        </div>
        <div class="recipeContainer" id="recipeContainer"></div>
    </div>
    


<script src="script.js"></script>
</body>

</html>
